<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script>
(function() {
  var CURRENT_BUILD = 'v36';
  try {
    var stored = localStorage.getItem('polytrack_app_build');
    if (stored !== CURRENT_BUILD) {
      localStorage.setItem('polytrack_app_build', CURRENT_BUILD);
      if ('caches' in window) {
        caches.keys().then(function(keys) {
          keys.forEach(function(k) { caches.delete(k); });
        });
      }
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          regs.forEach(function(r) { r.unregister(); });
        });
      }
    }
    // Auto-heal resolution & antialiasing settings for returning players
    var settingsRaw = localStorage.getItem('polytrack_v5_prod_settings');
    if (settingsRaw) {
      var sArr = JSON.parse(settingsRaw);
      if (Array.isArray(sArr)) {
        var mod = false;
        for (var i = 0; i < sArr.length; i++) {
          if (sArr[i][0] === 'Antialiasing' && sArr[i][1] === 'false') {
            sArr[i][1] = 'true';
            mod = true;
          }
          if (sArr[i][0] === 'RenderScale' && parseFloat(sArr[i][1]) < 1) {
            sArr[i][1] = '1';
            mod = true;
          }
        }
        if (mod) {
          localStorage.setItem('polytrack_v5_prod_settings', JSON.stringify(sArr));
        }
      }
    }
  } catch(e) {}
})();
</script>

  window.addEventListener("load", function() {

}
