<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <rect width="128" height="128" fill="#000000"/>
  
  <defs>
    <linearGradient id="f1_body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d4d"/>
      <stop offset="50%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>
    <linearGradient id="f1_white" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="f1_metal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="f1_tire" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="f1_rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
  </defs>

  <!-- Rear Left Wheel (back layer) -->
  <ellipse cx="88" cy="58" rx="8" ry="15" fill="#090d16"/>
  <ellipse cx="88" cy="58" rx="4.5" ry="9" fill="#334155"/>

  <!-- Rear Wing Mount & Assembly -->
  <polygon points="86,43 114,46 110,52 82,49" fill="#e11d48"/>
  <polygon points="86,43 114,46 113,44 85,41" fill="#ffffff"/> <!-- Top highlight -->
  <!-- Right endplate -->
  <polygon points="114,46 118,42 118,59 114,57" fill="#ff4d4d"/>
  <!-- Left endplate -->
  <polygon points="86,43 82,39 82,54 86,52" fill="#9f1239"/>
  <!-- Pylons -->
  <polygon points="94,48 96,62 93,62 91,48" fill="#1e293b"/>
  <polygon points="102,50 104,64 101,64 99,50" fill="#1e293b"/>

  <!-- Front Left Wheel (back layer) -->
  <ellipse cx="36" cy="72" rx="7" ry="13" fill="#090d16"/>
  <ellipse cx="36" cy="72" rx="4" ry="8" fill="#334155"/>

  <!-- Main Chassis (Underbody / Floor) -->
  <polygon points="18,92 42,98 94,80 108,74 104,68 38,78" fill="#090d16"/>

  <!-- Main Chassis Body (Low-poly Facets) -->
  <polygon points="102,64 76,68 34,87 20,93 18,90 40,74 72,59 98,58" fill="url(#f1_body)"/>
  
  <!-- White Center Livery Stripe -->
  <polygon points="96,60 74,64 40,76 21,91 19,89 41,73 70,58 92,57" fill="url(#f1_white)"/>
  
  <!-- Sidepod Right -->
  <polygon points="62,67 88,67 85,81 58,77" fill="url(#f1_body)"/>
  <polygon points="58,77 85,81 83,86 56,81" fill="#9f1239"/> <!-- Sidepod under-edge -->
  <polygon points="62,67 88,67 86,65 64,65" fill="#ff4d4d"/> <!-- Sidepod top facet -->
  <!-- Sidepod Air Radiator Intake -->
  <polygon points="58,67 62,67 58,77 54,76" fill="#000000"/>

  <!-- Cockpit Opening & Halo -->
  <polygon points="66,61 76,63 72,69 62,66" fill="#000000"/>
  <!-- Yellow Helmet -->
  <circle cx="69" cy="62" r="4" fill="#facc15"/>
  <ellipse cx="69" cy="62" rx="3" ry="1.5" fill="#000000"/> <!-- Visor -->
  <!-- Halo Arch -->
  <polygon points="59,64 73,61 76,64 63,67" fill="#f1f5f9" stroke="#0f172a" stroke-width="0.8"/>
  <polygon points="68,61 71,55 74,55 71,61" fill="#cbd5e1"/> <!-- Halo center pillar -->

  <!-- Engine Airbox Induction Scoop -->
  <polygon points="76,56 84,58 81,64 74,62" fill="#e11d48"/>
  <polygon points="75,56 77,53 80,55 78,58" fill="#000000"/> <!-- Airbox Hole -->
  <polygon points="77,53 85,55 84,58 76,56" fill="#ffffff"/> <!-- Scoop highlight -->

  <!-- Front Wing Assembly -->
  <polygon points="12,89 38,101 34,106 8,94" fill="#e11d48"/>
  <polygon points="12,89 38,101 36,99 14,87" fill="#ffffff"/> <!-- Top blade highlight -->
  <!-- Left Endplate -->
  <polygon points="8,94 6,88 6,97 8,99" fill="#9f1239"/>
  <!-- Right Endplate -->
  <polygon points="38,101 42,96 42,105 38,107" fill="#ff4d4d"/>
  <!-- Front Wing Flaps -->
  <polygon points="15,92 36,102 34,104 13,94" fill="url(#f1_white)"/>

  <!-- Front Suspension Wishbone Carbon Rods -->
  <line x1="26" y1="88" x2="33" y2="79" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="28" y1="91" x2="48" y2="94" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Front Right Wheel (foreground) -->
  <ellipse cx="48" cy="95" rx="9" ry="16" fill="url(#f1_tire)"/>
  <ellipse cx="48" cy="95" rx="5.5" ry="10" fill="url(#f1_rim)"/>
  <circle cx="48" cy="95" r="2.5" fill="#090d16"/>

  <!-- Rear Right Wheel (foreground) -->
  <ellipse cx="104" cy="74" rx="11" ry="19" fill="url(#f1_tire)"/>
  <ellipse cx="104" cy="74" rx="6.5" ry="12" fill="url(#f1_rim)"/>
  <circle cx="104" cy="74" r="3" fill="#090d16"/>
</svg>